<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>User Card</title>
    <style>
        :root {
            --bg: #0b0e14;
            --glass: rgba(255, 255, 255, .06);
            --border: rgba(255, 255, 255, .12);
            --text: #e8ecf2;
            --muted: #9aa4b2;
            --brand: #7c5cff;
            --accent: #19d1a3;
            --chip: rgba(124, 92, 255, .12);
            --radius: 18px;
            --shadow: 0 20px 60px rgba(0, 0, 0, .45);
        }

        @media (prefers-color-scheme: night) {
            :root {
                --bg: #f5f7fb;
                --glass: rgba(51, 50, 50, 0.9);
                --border: #e5e9f2;
                --text: #838383;
                --muted: #5e6a7f;
                --chip: #efeaff;
                --shadow: 0 18px 50px rgba(30, 50, 110, .12);
            }
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 28px;
            font: 500 16px/1.55 Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 900px at 10% 10%, rgba(124, 92, 255, .18), transparent 95%),
                radial-gradient(1000px 800px at 120% 120%, rgba(25, 209, 163, .14), transparent 45%),
                var(--bg);
        }

        .card {
            width: min(880px, 100%);
            display: grid;
            grid-template-columns: 300px 1fr;
            backdrop-filter: blur(10px);
            background: linear-gradient(180deg, rgba(27, 19, 19, 0.814), rgba(54, 53, 53, 0.902));
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* Sidebar */
        .side {
            position: relative;
            padding: 28px;
            border-right: 1px solid var(--border);
            background:
                linear-gradient(180deg, rgba(124, 92, 255, .12), transparent 40%),
                linear-gradient(0deg, rgba(25, 209, 163, .10), transparent 30%),
                transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .avatar {
            width: 112px;
            height: 112px;
            border-radius: 22px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-bottom: 16px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }

        .handle {
            color: var(--muted);
            font-size: .95rem
        }

        .bios {
            display: grid;
            gap: 10px;
            margin-top: 16px
        }

        .bio-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border: 1px dashed var(--border);
            border-radius: 12px;
        }

        .bio-info .label {
            color: var(--muted);
            font-size: .9rem
        }

        .bio-info .value {
            font-weight: 800
        }

        .links {
            display: grid;
            gap: 8px;
            margin-top: 18px
        }

        .link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 12px;
            transition: transform .06s ease, background .2s ease, border-color .2s ease;
        }

        .link:hover {
            transform: translateY(-1px);
            border-color: rgba(124, 92, 255, .45)
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--brand)
        }

        /* Main */
        .main {
            padding: 28px;
            width: min(600px, 100%);

        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: .85rem;
            color: var(--muted);
            letter-spacing: .4px;
            text-transform: uppercase;
        }

        .eyebrow .pill {
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--chip);
        }

        .name {
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: .2px;
            margin: 10px 0 6px
        }

        .role {
            color: var(--muted)
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 14px 0 18px
        }

        .tag {
            padding: 6px 10px;
            font-size: .88rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: linear-gradient(180deg, rgba(255, 255, 255, .06), transparent);
            background: var(--chip);
        }

        .tag-icon {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .bio {
            color: var(--muted);
            margin-top: 6px
        }

        .gallery {
            width: 100%;
            margin-top: 22px;
            border-top: 1px solid var(--border);
            padding-top: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px
        }

        .event {
            display: grid;
            grid-template-columns: 14px 1fr;
            gap: 12px;
            align-items: start;
        }

        .event .tick {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent);
            margin-top: 4px
        }

        .event .desc {
            display: flex;
            /* justify-content: space-between;
            flex-wrap: wrap; */
            gap: 10px;
        }

        .event .title {
            font-weight: 700
        }

        .event .when {
            color: var(--muted);
            /* font-size: .92rem */
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 22px
        }

        .btn {
            appearance: none;
            border: 1px solid var(--border);
            background: transparent;
            padding: 12px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            text-decoration: none;
            color: var(--text);
            transition: transform .06s ease, border-color .2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            border-color: rgba(25, 209, 163, .5)
        }

        .btn--primary {
            background: linear-gradient(180deg, rgba(124, 92, 255, .22), rgba(124, 92, 255, .10));
            border-color: rgba(124, 92, 255, .5);
        }

        @media (max-width: 760px) {
            .card {
                grid-template-columns: 1fr
            }

            .side {
                border-right: none;
                border-bottom: 1px solid var(--border)
            }
        }

        .movie-thumbs {
            height: 150px;
        }

        /* .movie-thumbs:hover {
            height: 100%;
        } */
    </style>
</head>

<body style="background-color: black;">
    <article class="card" role="region" aria-labelledby="name">
        <!-- Sidebar -->
        <aside class="side">
            <div>
                <div class="avatar">
                    <!-- Replace with your Base64 or URL -->
                    <img alt="avatar" class="avatar-img" src='' />
                </div>
                <div class="handle">@bio</div>

                <div class="bios" aria-label="Stats">
                </div>
            </div>

            <div class="links-section">
            </div>
        </aside>

        <!-- Main -->
        <section class="main">
            <div style="display: flex; align-items: center;">
                <h1 class="name" id="idolName"></h1>
                <img class="nation-flag" src="">
            </div>
            <div class="role">JAV Actress</div>

            <div class="tags" aria-label="Skills">
            </div>

            <p class="source-links">
                <img style="height: 25px; margin-right: 5px;"
                    src="https://www.javdatabase.com/wp-content/themes/bootscore-child/img/logo/LOGO.png" />
            </p>

            <div class="gallery" aria-label="Recent highlights">
            </div>

        </section>
    </article>

</body>

</html>
