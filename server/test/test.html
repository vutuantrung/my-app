<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Model — Detail</title>
        <!-- CSP suitable for Electron renderer -->
        <style>
            :root {
                --bg: #0b0d12;
                --panel: #0f1218;
                --muted: #93a1b2;
                --text: #e8edf2;
                --line: #1a2230;
                --chip: #1b2433;
                --accent: #7ee787;
            }
            html,
            body {
                margin: 0;
                height: 100%;
                background: radial-gradient(1200px 800px at 20% -10%, #131722, var(--bg));
                color: var(--text);
                font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
            }
            .page {
                min-height: 100%;
                display: grid;
                grid-template-rows: auto 1fr;
            }

            header {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 14px 18px;
                border-bottom: 1px solid var(--line);
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.04), rgba(255, 255, 255, 0));
            }
            .name {
                font-size: 20px;
                font-weight: 700;
                letter-spacing: 0.3px;
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                margin-left: auto;
            }
            .chip {
                background: var(--chip);
                color: var(--text);
                border: 1px solid #232c3f;
                padding: 6px 10px;
                border-radius: 999px;
                font-size: 12px;
            }

            .content {
                display: grid;
                grid-template-columns: 1fr;
                gap: 16px;
                padding: 16px;
            }
            @media (min-width: 980px) {
                .content {
                    grid-template-columns: 320px 1fr;
                }
            }

            .card {
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 16px;
                overflow: hidden;
            }
            .card h3 {
                font-size: 13px;
                font-weight: 600;
                letter-spacing: 0.3px;
                color: #c8d2de;
                margin: 0 0 8px 0;
            }
            .section {
                padding: 14px 14px 16px 14px;
            }

            .avatar-wrap {
                display: grid;
                gap: 12px;
            }
            .avatar {
                width: 100%;
                aspect-ratio: 3/4;
                object-fit: cover;
                border-radius: 12px;
            }
            .meta {
                display: grid;
                gap: 8px;
            }
            .row {
                display: grid;
                grid-template-columns: 120px 1fr;
                gap: 8px;
                align-items: center;
                font-size: 13px;
            }
            .label {
                color: #a7b2c3;
            }

            /* Cover carousel */
            .covers {
                position: relative;
            }
            .cover-strip {
                display: flex;
                gap: 10px;
                overflow: auto;
                scroll-snap-type: x mandatory;
                padding-bottom: 6px;
            }
            .cover-strip::-webkit-scrollbar {
                height: 8px;
            }
            .cover {
                flex: 0 0 auto;
                width: 58%;
                max-width: 520px;
                aspect-ratio: 16/9;
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid #1c2637;
                scroll-snap-align: center;
            }
            .cover img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            @media (min-width: 720px) {
                .cover {
                    width: 44%;
                }
            }
            @media (min-width: 1180px) {
                .cover {
                    width: 32%;
                }
            }

            /* Measurements */
            .measure-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 10px;
            }
            .metric {
                background: #0c131f;
                border: 1px solid #1b2639;
                border-radius: 12px;
                padding: 10px;
            }
            .metric .k {
                font-size: 11px;
                color: #9fb1c8;
            }
            .metric .v {
                font-size: 16px;
                font-weight: 700;
            }

            /* Movie posters */
            .poster-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }
            @media (min-width: 720px) {
                .poster-grid {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                }
            }
            @media (min-width: 1040px) {
                .poster-grid {
                    grid-template-columns: repeat(5, minmax(0, 1fr));
                }
            }
            .poster {
                position: relative;
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid #1c2637;
            }
            .poster img {
                width: 100%;
                aspect-ratio: 2/3;
                object-fit: cover;
                display: block;
            }

            .muted {
                color: var(--muted);
            }
        </style>
    </head>
    <body>
        <div class="page">
            <header>
                <div class="name" id="name">Model Name</div>
                <div class="tags" id="tags"></div>
            </header>

            <main class="content">
                <!-- Left column: Avatar + info -->
                <aside class="card section">
                    <div class="avatar-wrap">
                        <img id="avatar" class="avatar" alt="Avatar" />
                        <div class="meta">
                            <div class="row">
                                <div class="label">Date of birth</div>
                                <div id="dob"></div>
                            </div>
                            <div class="row">
                                <div class="label">Date of debut</div>
                                <div id="debut"></div>
                            </div>
                            <div class="row">
                                <div class="label">Movies</div>
                                <div id="moviesCount"></div>
                            </div>
                            <div class="row">
                                <div class="label">Height</div>
                                <div id="height"></div>
                            </div>
                            <div class="row">
                                <div class="label">Measurements</div>
                                <div id="measurements"></div>
                            </div>
                            <div class="row">
                                <div class="label">Cup size</div>
                                <div id="cup"></div>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- Right column: Covers + Posters -->
                <section class="card">
                    <div class="section">
                        <h3>Cover photos</h3>
                        <div class="covers">
                            <div class="cover-strip" id="coverStrip"></div>
                        </div>
                    </div>
                    <div class="section">
                        <h3>Movies (<span id="moviesCount2">0</span>)</h3>
                        <div class="poster-grid" id="posters"></div>
                    </div>
                </section>
            </main>
        </div>

        <script>
            // --- Demo data (replace with actual data at runtime) ---
            const model = {
                name: "Jane Doe",
                avatar: "file:///C:/assets/models/jane/avatar.jpg", // or https:// / data:
                covers: [
                    "https://img.jrants.com/wp-content/uploads/2023/05/ls57he.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/05/ls6xk3.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/05/ls7vwa.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/06/lv50sk.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/09/sf7e9n.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/09/7w7e4cy.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/09/sf5qpr.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/09/sfjj95.gif",
                ],
                dob: "1998-03-14",
                debut: "2018-09-01",
                moviesCount: 24,
                height: 166,
                measurements: { bust: 86, waist: 58, hip: 88 },
                cup: "D",
                tags: ["Glamour", "Athletic", "Featured"],
                posters: [
                    "https://meitu.jrants.com/wp-content/uploads/2023/06/03/90507030459482.jpg",
                    "https://meitu.jrants.com/wp-content/uploads/2023/06/03/90507030459484.jpg",
                    "https://meitu.jrants.com/wp-content/uploads/2023/06/03/90507030459487.jpg",
                    "https://j.uuu.cam/fanza/minami-aizawa/ipvr00159/minami-aizawa-3.jpg",
                    "https://i.redd.it/mepfe104q53d1.gif",
                    "https://meitu.jrants.com/wp-content/uploads/2023/09/28/126722280829463.jpg",
                    "https://img.jrants.com/wp-content/uploads/2023/09/sf5qpr.gif",
                ],
            };

            // --- Render ---
            function fmtDate(iso) {
                if (!iso) return "—";
                try {
                    const d = new Date(iso);
                    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
                } catch {
                    return iso;
                }
            }

            function renderModel(m) {
                document.getElementById("name").textContent = m.name || "—";
                document.getElementById("avatar").src = m.avatar || "";

                const tags = document.getElementById("tags");
                tags.innerHTML = "";
                (m.tags || []).forEach((t) => {
                    const el = document.createElement("span");
                    el.className = "chip";
                    el.textContent = t;
                    tags.appendChild(el);
                });

                document.getElementById("dob").textContent = fmtDate(m.dob);
                document.getElementById("debut").textContent = fmtDate(m.debut);
                document.getElementById("moviesCount").textContent = m.moviesCount ?? 0;
                document.getElementById("height").textContent = m.height ? m.height + " cm" : "—";
                const ms = m.measurements || {};
                document.getElementById("measurements").textContent = ms.bust && ms.waist && ms.hip ? `${ms.bust}-${ms.waist}-${ms.hip}` : "—";
                document.getElementById("cup").textContent = m.cup || "—";
                document.getElementById("moviesCount2").textContent = m.moviesCount ?? 0;

                // Covers
                const strip = document.getElementById("coverStrip");
                strip.innerHTML = "";
                (m.covers || []).forEach((src) => {
                    const c = document.createElement("div");
                    c.className = "cover";
                    const img = new Image();
                    img.loading = "lazy";
                    img.decoding = "async";
                    img.src = src;
                    img.alt = "Cover";
                    c.appendChild(img);
                    strip.appendChild(c);
                });

                // Posters
                const posters = document.getElementById("posters");
                posters.innerHTML = "";
                (m.posters || []).forEach((src) => {
                    const p = document.createElement("div");
                    p.className = "poster";
                    const img = new Image();
                    img.loading = "lazy";
                    img.decoding = "async";
                    img.src = src;
                    img.alt = "Poster";
                    p.appendChild(img);
                    posters.appendChild(p);
                });

                startAutoScroll(strip);
            }

            // --- Auto-scroll covers (pause on hover, loop) ---
            function startAutoScroll(container) {
                if (!container) return;
                let timer = null;
                const step = () => {
                    const max = container.scrollWidth - container.clientWidth;
                    const atEnd = Math.abs(container.scrollLeft - max) < 2;
                    const next = atEnd ? 0 : Math.min(container.scrollLeft + Math.max(120, container.clientWidth * 0.33), max);
                    container.scrollTo({ left: next, behavior: "smooth" });
                };
                const run = () => {
                    clearInterval(timer);
                    timer = setInterval(step, 2500);
                };
                run();
                container.addEventListener("mouseenter", () => clearInterval(timer));
                container.addEventListener("mouseleave", run);
            }

            // If you get data from main process/IPC, call renderModel(payload)
            renderModel(model);

            // Example: preload could expose window.api.getModel();
            // (async()=>{ const m = await window.api.getModel(); renderModel(m); })();
        </script>
    </body>
</html>
