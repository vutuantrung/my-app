<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Actress – Profile</title>
        <style>
            :root {
                --bg: #0b0d10;
                --panel: #12161a;
                --muted: #a7b0bf;
                --text: #e8edf5;
                --brand: #4ea1ff;
                --chip: #1a2027;
                --border: #222a33;
                --shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
                --radius: 16px;
                --radius-sm: 10px;
                --maxw: 1280px;
            }

            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                color: var(--text);
                font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
                background: radial-gradient(60rem 60rem at 20% -10%, rgba(78, 161, 255, 0.12), transparent 60%),
                    radial-gradient(70rem 60rem at 120% 10%, rgba(161, 78, 255, 0.09), transparent 60%), var(--bg);
            }

            .container {
                max-width: var(--maxw);
                margin: 0 auto;
                padding: 28px 20px 72px;
            }

            /* LAYOUT: left personal aside, right main content */
            .layout {
                display: grid;
                grid-template-columns: 320px 1fr;
                gap: 20px;
                align-items: start;
            }

            /* PERSONAL (ASIDE) */
            aside#personal {
                position: sticky;
                top: 20px;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                padding: 18px;
            }
            .avatar {
                width: 140px;
                height: 140px;
                border-radius: 50%;
                overflow: hidden;
                border: 2px solid #23303e;
                margin: 6px auto 14px;
                background: #0b0f14;
            }
            .avatar img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .name {
                text-align: center;
                margin: 0;
                font-size: clamp(22px, 3.4vw, 28px);
                letter-spacing: 0.3px;
            }
            .jpname {
                text-align: center;
                color: var(--muted);
                font-size: 14px;
                margin-top: 4px;
            }

            .meta {
                display: grid;
                grid-template-columns: 1fr;
                gap: 10px;
                margin-top: 14px;
            }
            .item {
                background: linear-gradient(180deg, #12181f, #0e1318);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                padding: 10px 12px;
            }
            .k {
                color: var(--muted);
                font-size: 12px;
                text-transform: uppercase;
                letter-spacing: 0.08em;
            }
            .v {
                margin-top: 6px;
                font-weight: 600;
                font-size: 15px;
            }

            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 8px;
            }
            .chip {
                background: var(--chip);
                color: #dce6f5;
                border: 1px solid #29313a;
                padding: 6px 10px;
                border-radius: 999px;
                font-size: 12px;
            }

            /* MAIN */
            main {
                display: grid;
                gap: 26px;
            }
            .section-title {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 12px;
            }
            .section-title h2 {
                margin: 0;
                font-size: 20px;
                letter-spacing: 0.2px;
            }
            .count {
                color: var(--muted);
                font-size: 13px;
            }

            /* FILMS */
            .grid-films {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 14px;
            }
            .film-card {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                overflow: hidden;
                box-shadow: var(--shadow);
                transition: transform 0.2s ease, box-shadow 0.2s ease;
                position: relative;
            }
            .film-card:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            }
            .media {
                aspect-ratio: 3/4;
                background: #0e1318;
                position: relative;
            }
            .media img,
            .media video {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .media video {
                position: absolute;
                inset: 0;
                opacity: 0;
                transition: opacity 0.25s ease;
            }
            .film-card:hover .media video {
                opacity: 1;
            }
            .film-info {
                padding: 8px 10px 10px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }
            .film-code {
                font-weight: 700;
                letter-spacing: 0.3px;
                font-size: 14px;
            }
            .film-meta {
                color: var(--muted);
                font-size: 12px;
            }

            /* PHOTOS SLIDER */
            .slider {
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: var(--radius);
                box-shadow: var(--shadow);
                padding: 12px;
            }
            .slider-viewport {
                overflow: hidden;
                border-radius: var(--radius-sm);
            }
            .slider-track {
                display: flex;
                gap: 10px;
                transition: transform 0.45s ease;
                will-change: transform;
            }
            .slide {
                flex: 0 0 100%;
                border: 1px solid var(--border);
                border-radius: var(--radius-sm);
                overflow: hidden;
                background: #0f141a;
            }
            .slide img {
                width: 100%;
                height: 480px;
                max-height: 60vh;
                object-fit: cover;
                display: block;
            }

            .slider-controls {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                margin-top: 10px;
            }
            .nav-btn {
                cursor: pointer;
                border: 1px solid #324152;
                background: #18212b;
                color: #dbe8fb;
                border-radius: 10px;
                padding: 8px 12px;
                font-weight: 600;
            }
            .nav-btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .dots {
                display: flex;
                gap: 6px;
                align-items: center;
            }
            .dot {
                width: 8px;
                height: 8px;
                border-radius: 999px;
                background: #2a3541;
                border: 1px solid #3b4b5d;
            }
            .dot.active {
                background: var(--brand);
                border-color: var(--brand);
                box-shadow: 0 0 0 3px rgba(78, 161, 255, 0.15);
            }

            .hidden {
                display: none !important;
            }

            @media (max-width: 980px) {
                .layout {
                    grid-template-columns: 1fr;
                }
                aside#personal {
                    position: static;
                }
                .slide img {
                    height: 300px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="layout">
                <!-- LEFT: PERSONAL INFO -->
                <aside id="personal">
                    <div class="avatar"><img src="assets/avatar.jpg" alt="Actress avatar" loading="lazy" /></div>
                    <h1 class="name" id="name">Jane Doe</h1>
                    <div class="jpname" id="jpname">(ジェーン・ドウ)</div>

                    <div class="meta">
                        <div class="item">
                            <div class="k">Nationality</div>
                            <div class="v" id="nationality">Japan</div>
                        </div>
                        <div class="item">
                            <div class="k">Date of birth</div>
                            <div class="v" id="dob">1998‑03‑15</div>
                        </div>
                        <div class="item">
                            <div class="k">Debut</div>
                            <div class="v" id="debut">2018‑07‑01</div>
                        </div>
                        <div class="item">
                            <div class="k">Total films</div>
                            <div class="v" id="total-films">32</div>
                        </div>
                        <div class="item">
                            <div class="k">Measurements</div>
                            <div class="v" id="measurements">88‑58‑86</div>
                        </div>
                        <div class="item">
                            <div class="k">Cup size</div>
                            <div class="v" id="cup">F</div>
                        </div>
                        <div class="item">
                            <div class="k">Height</div>
                            <div class="v" id="height">160 cm</div>
                        </div>
                        <div class="item">
                            <div class="k">Tags</div>
                            <div class="v">
                                <div class="chips" id="tags">
                                    <span class="chip">Elegant</span>
                                    <span class="chip">Gravure</span>
                                    <span class="chip">Cosplay</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- RIGHT: MAIN CONTENT -->
                <main>
                    <!-- FILMS -->
                    <section id="films">
                        <div class="section-title">
                            <h2>Films</h2>
                            <span class="count" id="films-count">32 titles</span>
                        </div>
                        <div class="grid-films" id="films-grid">
                            <!-- duplicate these to ~30 items -->
                            <article class="film-card" data-code="ABP-123" data-video-src="assets/ABP-123-preview.mp4" tabindex="0">
                                <div class="media">
                                    <img src="assets/ABP-123.jpg" alt="ABP-123 cover" loading="lazy" />
                                    <video muted loop playsinline preload="none" aria-hidden="true"></video>
                                </div>
                                <div class="film-info">
                                    <div class="film-code">ABP-123</div>
                                    <div class="film-meta">2019</div>
                                </div>
                            </article>

                            <article class="film-card" data-code="MIDE-456" data-video-src="assets/MIDE-456-preview.mp4" tabindex="0">
                                <div class="media">
                                    <img src="assets/MIDE-456.jpg" alt="MIDE-456 cover" loading="lazy" />
                                    <video muted loop playsinline preload="none" aria-hidden="true"></video>
                                </div>
                                <div class="film-info">
                                    <div class="film-code">MIDE-456</div>
                                    <div class="film-meta">2020</div>
                                </div>
                            </article>

                            <article class="film-card" data-code="IPX-789" data-video-src="assets/IPX-789-preview.mp4" tabindex="0">
                                <div class="media">
                                    <img src="assets/IPX-789.jpg" alt="IPX-789 cover" loading="lazy" />
                                    <video muted loop playsinline preload="none" aria-hidden="true"></video>
                                </div>
                                <div class="film-info">
                                    <div class="film-code">IPX-789</div>
                                    <div class="film-meta">2021</div>
                                </div>
                            </article>

                            <!-- add ~27 more cards -->
                        </div>
                    </section>

                    <!-- PHOTOS (SLIDER, auto-hidden if empty) -->
                    <section id="photos" class="slider">
                        <div class="section-title">
                            <h2>Photos</h2>
                            <span class="count" id="photos-count">6</span>
                        </div>
                        <div class="slider-viewport">
                            <div class="slider-track" id="slider-track">
                                <figure class="slide"><img src="assets/p1.jpg" alt="Photo 1" loading="lazy" /></figure>
                                <figure class="slide"><img src="assets/p2.jpg" alt="Photo 2" loading="lazy" /></figure>
                                <figure class="slide"><img src="assets/p3.jpg" alt="Photo 3" loading="lazy" /></figure>
                                <figure class="slide"><img src="assets/p4.jpg" alt="Photo 4" loading="lazy" /></figure>
                                <figure class="slide"><img src="assets/p5.jpg" alt="Photo 5" loading="lazy" /></figure>
                                <figure class="slide"><img src="assets/p6.jpg" alt="Photo 6" loading="lazy" /></figure>
                            </div>
                        </div>
                        <div class="slider-controls">
                            <button class="nav-btn" id="prevBtn" aria-label="Previous">◀</button>
                            <div class="dots" id="dots"></div>
                            <button class="nav-btn" id="nextBtn" aria-label="Next">▶</button>
                        </div>
                    </section>
                </main>
            </div>
        </div>

        <script>
            // --- Film hover preview (lazy video) ---
            (function enableFilmHoverPreview() {
                const cards = document.querySelectorAll(".film-card");
                cards.forEach((card) => {
                    const video = card.querySelector("video");
                    const src = card.getAttribute("data-video-src");
                    if (!video || !src) return;
                    let loaded = false;
                    const ensureLoaded = () => {
                        if (!loaded) {
                            video.src = src;
                            loaded = true;
                        }
                    };
                    const play = () => {
                        ensureLoaded();
                        const p = video.play();
                        if (p && p.catch) p.catch(() => {});
                    };
                    const stop = () => {
                        video.pause();
                        video.currentTime = 0;
                    };
                    card.addEventListener("mouseenter", play);
                    card.addEventListener("mouseleave", stop);
                    card.addEventListener("focusin", play);
                    card.addEventListener("focusout", stop);
                });
            })();

            // --- Photos slider: autoplay, controls, dots ---
            (function slider() {
                const section = document.getElementById("photos");
                const track = document.getElementById("slider-track");
                if (!track || track.children.length === 0) {
                    if (section) section.classList.add("hidden");
                    return;
                }

                const slides = Array.from(track.children);
                const countEl = document.getElementById("photos-count");
                if (countEl) countEl.textContent = String(slides.length);

                const dotsWrap = document.getElementById("dots");
                const prevBtn = document.getElementById("prevBtn");
                const nextBtn = document.getElementById("nextBtn");

                let index = 0;
                const setIndex = (i) => {
                    index = (i + slides.length) % slides.length;
                    update();
                };
                const update = () => {
                    track.style.transform = `translateX(${-index * 100}%)`;
                    // update dots
                    dotsWrap.querySelectorAll(".dot").forEach((d, di) => d.classList.toggle("active", di === index));
                    // buttons disabled state (optional continuous loop, so keep enabled)
                };

                // create dots
                slides.forEach((_, i) => {
                    const d = document.createElement("div");
                    d.className = "dot" + (i === 0 ? " active" : "");
                    d.addEventListener("click", () => setIndex(i));
                    dotsWrap.appendChild(d);
                });

                // controls
                prevBtn.addEventListener("click", () => setIndex(index - 1));
                nextBtn.addEventListener("click", () => setIndex(index + 1));

                // autoplay
                let timer = null;
                const start = () => {
                    stop();
                    timer = setInterval(() => setIndex(index + 1), 3500);
                };
                const stop = () => {
                    if (timer) {
                        clearInterval(timer);
                        timer = null;
                    }
                };
                start();

                // pause on hover/touch
                section.addEventListener("mouseenter", stop);
                section.addEventListener("mouseleave", start);
                section.addEventListener("touchstart", stop, { passive: true });
                section.addEventListener("touchend", start, { passive: true });

                // resize handling keeps full-width slides
                const ro = new ResizeObserver(() => update());
                ro.observe(track);
            })();

            // --- Films count ---
            (function updateFilmCount() {
                const grid = document.getElementById("films-grid");
                const count = document.getElementById("films-count");
                if (grid && count) count.textContent = `${grid.querySelectorAll(".film-card").length} titles`;
            })();
        </script>
    </body>
</html>
