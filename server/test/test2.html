<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Model Profile</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <style>
            :root {
                --bg: #0b0d10;
                --panel: #12151a;
                --muted: #98a2b3;
                --text: #e6e9ee;
                --accent: #4f46e5;
                --chip: #1b2130;
                --ring: 0 0 0 3px rgb(79 70 229 / 20%);
                --radius: 14px;
                --gap: 16px;
                --shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
                --sidebar-w: 320px;
            }
            @media (prefers-color-scheme: light) {
                :root {
                    --bg: #f6f7f9;
                    --panel: #ffffff;
                    --muted: #5b6677;
                    --text: #141820;
                    --chip: #eef1f6;
                    --shadow: 0 10px 22px rgba(16, 24, 40, 0.08);
                }
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
            }
            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font: 500 16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
            }
            img {
                display: block;
                max-width: 100%;
            }
            .container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 20px;
            }

            /* Header */
            .header {
                position: sticky;
                top: 0;
                z-index: 10;
                backdrop-filter: blur(8px);
                background: color-mix(in oklab, var(--bg) 80%, transparent);
                border-bottom: 1px solid color-mix(in oklab, var(--text) 10%, transparent);
            }
            .header-inner {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 14px 20px;
                max-width: 1200px;
                margin: 0 auto;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 800;
                letter-spacing: 0.2px;
            }
            .brand .dot {
                width: 10px;
                height: 10px;
                border-radius: 999px;
                background: var(--accent);
                box-shadow: var(--ring);
            }
            .spacer {
                flex: 1;
            }
            .badge {
                font-size: 12px;
                padding: 6px 10px;
                border-radius: 999px;
                background: var(--chip);
                color: var(--muted);
                border: 1px solid color-mix(in oklab, var(--text) 8%, transparent);
            }

            /* NEW: Two-column layout */
            .layout {
                display: grid;
                grid-template-columns: minmax(260px, var(--sidebar-w)) 1fr;
                gap: var(--gap);
                align-items: start;
            }
            @media (max-width: 900px) {
                .layout {
                    grid-template-columns: 1fr;
                }
            }
            .sidebar {
                position: relative;
            }
            @media (min-width: 901px) {
                .sidebar-sticky {
                    position: sticky;
                    top: 82px; /* below header */
                }
            }

            /* Hero card now stands alone in sidebar */
            .hero {
                background: var(--panel);
                border-radius: var(--radius);
                padding: 18px;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                gap: 16px;
            }
            .avatar-wrap {
                width: 100%;
                aspect-ratio: 1 / 1;
                border-radius: 16px;
                overflow: hidden;
                border: 1px solid color-mix(in oklab, var(--text) 10%, transparent);
                position: relative;
            }
            .avatar-wrap img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .verified {
                position: absolute;
                bottom: 10px;
                right: 10px;
                background: var(--accent);
                color: white;
                font-size: 12px;
                font-weight: 700;
                padding: 6px 10px;
                border-radius: 999px;
                box-shadow: var(--shadow);
            }
            .name {
                font-size: clamp(22px, 3.2vw, 28px);
                font-weight: 800;
                letter-spacing: 0.3px;
                margin: 2px 0 0 0;
            }
            .name-row {
                display: flex;
                align-items: center;
                gap: 10px;
                flex-wrap: wrap;
            }
            .kpi {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 12px;
                padding: 6px 8px;
                border-radius: 999px;
                background: var(--chip);
                border: 1px solid color-mix(in oklab, var(--text) 8%, transparent);
            }
            .stats {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .stat {
                background: var(--chip);
                padding: 12px 12px;
                border-radius: 10px;
                border: 1px solid color-mix(in oklab, var(--text) 8%, transparent);
            }
            .stat small {
                display: block;
                color: var(--muted);
                font-weight: 600;
                font-size: 12px;
            }
            .stat strong {
                font-size: 15px;
            }
            .tags {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
            }
            .tag {
                font-size: 12px;
                padding: 8px 10px;
                border-radius: 999px;
                background: var(--chip);
                border: 1px solid color-mix(in oklab, var(--text) 8%, transparent);
            }

            /* Right main content */
            .section {
                margin-top: 0;
            }
            .section + .section {
                margin-top: 24px;
            }
            .section h2 {
                margin: 0 0 10px 2px;
                font-size: 18px;
                color: var(--muted);
                font-weight: 700;
                letter-spacing: 0.2px;
            }

            /* Carousel */
            .carousel {
                position: relative;
                overflow: hidden;
                border-radius: var(--radius);
                background: var(--panel);
                border: 1px solid color-mix(in oklab, var(--text) 10%, transparent);
            }
            .track {
                display: flex;
                gap: 8px;
                padding: 8px;
                overflow: auto;
                scroll-snap-type: x mandatory;
                scroll-behavior: smooth;
            }
            .track::-webkit-scrollbar {
                height: 8px;
            }
            .track::-webkit-scrollbar-thumb {
                background: color-mix(in oklab, var(--text) 16%, transparent);
                border-radius: 8px;
            }
            .slide {
                flex: 0 0 70%;
                max-width: 70%;
                scroll-snap-align: center;
                position: relative;
                border-radius: 12px;
                overflow: hidden;
                aspect-ratio: 16/9;
                background: #0a0a0a;
            }
            .slide img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            @media (min-width: 900px) {
                .slide {
                    flex-basis: 48%;
                    max-width: 48%;
                }
            }
            @media (max-width: 520px) {
                .slide {
                    flex-basis: 92%;
                    max-width: 92%;
                }
            }
            .controls {
                position: absolute;
                inset: 0;
                pointer-events: none;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
            }
            .btn {
                pointer-events: auto;
                border: 0;
                width: 40px;
                height: 40px;
                border-radius: 999px;
                display: grid;
                place-items: center;
                background: color-mix(in oklab, var(--bg) 70%, transparent);
                color: var(--text);
                box-shadow: var(--ring);
                cursor: pointer;
            }

            /* Posters grid */
            .posters {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }
            @media (min-width: 640px) {
                .posters {
                    grid-template-columns: repeat(3, minmax(0, 1fr));
                }
            }
            @media (min-width: 1100px) {
                .posters {
                    grid-template-columns: repeat(5, minmax(0, 1fr));
                }
            }
            .poster {
                background: var(--panel);
                border-radius: 12px;
                overflow: hidden;
                border: 1px solid color-mix(in oklab, var(--text) 10%, transparent);
                transition: transform 0.18s ease, box-shadow 0.18s ease;
            }
            .poster:focus-within,
            .poster:hover {
                transform: translateY(-2px);
                box-shadow: var(--shadow);
            }
            .poster img {
                aspect-ratio: 2/3;
                width: 100%;
                height: auto;
                object-fit: cover;
            }
            .poster .meta {
                padding: 10px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 8px;
            }
            .poster .meta span {
                font-size: 12px;
                color: var(--muted);
            }

            /* Footer */
            .footer {
                color: var(--muted);
                text-align: center;
                padding: 30px 10px;
                font-size: 13px;
            }

            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
                padding: 0;
                margin: -1px;
            }
        </style>
    </head>
    <body>
        <header class="header" role="banner">
            <div class="header-inner">
                <div class="brand"><span class="dot" aria-hidden="true"></span> Model Profile</div>
                <div class="spacer"></div>
                <span class="badge">Vanilla HTML · CSS · JS</span>
            </div>
        </header>

        <main class="container" role="main" aria-live="polite">
            <!-- NEW: two-column layout -->
            <div class="layout">
                <!-- Left: profile sidebar -->
                <aside class="sidebar">
                    <div class="sidebar-sticky">
                        <section class="hero" id="profile" aria-label="Profile summary">
                            <!-- injected by JS -->
                        </section>
                    </div>
                </aside>

                <!-- Right: content -->
                <div class="main">
                    <section class="section" aria-label="Cover photos">
                        <h2>Cover photos</h2>
                        <div class="carousel" id="covers">
                            <div class="track" id="coverTrack" tabindex="0" aria-roledescription="carousel" aria-label="Cover carousel">
                                <!-- injected by JS -->
                            </div>
                            <div class="controls" aria-hidden="false">
                                <button class="btn" id="prevBtn" aria-label="Previous slide">⟨</button>
                                <button class="btn" id="nextBtn" aria-label="Next slide">⟩</button>
                            </div>
                        </div>
                    </section>

                    <section class="section" aria-label="Movies">
                        <h2>Movies</h2>
                        <div class="posters" id="posters"><!-- injected by JS --></div>
                    </section>
                </div>
            </div>
        </main>

        <footer class="footer">© <span id="year"></span> Demo UI. All rights reserved.</footer>

        <script>
            // --- Demo data ------------------------------------------------------------
            const modelData = {
                name: "Aria K.",
                avatar: "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?q=80&w=1080&auto=format&fit=crop",
                covers: [
                    "https://img.jrants.com/wp-content/uploads/2023/05/ls57he.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/05/ls6xk3.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/05/ls7vwa.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/06/lv50sk.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/09/sf7e9n.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/09/7w7e4cy.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/09/sf5qpr.gif",
                    "https://img.jrants.com/wp-content/uploads/2023/09/sfjj95.gif",
                ],
                dateOfBirth: "1997-04-12",
                dateOfDebut: "2017-06-01",
                moviesCount: 48,
                measurements: "86-58-88",
                cupSize: "D",
                heightCm: 168,
                tags: ["Elegant", "Runway", "Commercial", "Editorial", "Award-winning"],
                movies: [
                    {
                        title: "Velvet Horizon",
                        year: 2022,
                        poster: "https://images.unsplash.com/photo-1524985069026-dd778a71c7b4?q=80&w=900&auto=format&fit=crop",
                        rating: 8.7,
                    },
                    {
                        title: "Neon Reverie",
                        year: 2021,
                        poster: "https://images.unsplash.com/photo-1497032205916-ac775f0649ae?q=80&w=900&auto=format&fit=crop",
                        rating: 8.2,
                    },
                    {
                        title: "Midnight Atlas",
                        year: 2020,
                        poster: "https://images.unsplash.com/photo-1517602302552-471fe67acf66?q=80&w=900&auto=format&fit=crop",
                        rating: 7.9,
                    },
                    {
                        title: "Glass Garden",
                        year: 2019,
                        poster: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=900&auto=format&fit=crop",
                        rating: 7.6,
                    },
                    {
                        title: "Paper Skies",
                        year: 2018,
                        poster: "https://images.unsplash.com/photo-1505682634904-d7c075c64a14?q=80&w=900&auto=format&fit=crop",
                        rating: 7.8,
                    },
                    {
                        title: "Lunar Threads",
                        year: 2023,
                        poster: "https://images.unsplash.com/photo-1496619684348-0f0602a9b4c8?q=80&w=900&auto=format&fit=crop",
                        rating: 8.4,
                    },
                ],
            };

            const fmt = {
                date(iso) {
                    try {
                        const d = new Date(iso);
                        return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "2-digit" });
                    } catch {
                        return iso;
                    }
                },
            };

            // Render sidebar profile
            function renderProfile(data) {
                const el = document.getElementById("profile");
                el.innerHTML = `
        <div class="avatar-wrap">
          <img src="${data.avatar}" alt="${data.name} avatar" loading="eager" />
          <span class="verified" aria-label="Verified">✓</span>
        </div>

        <div class="name-row">
          <h1 class="name">${data.name}</h1>
          <span class="kpi" title="Movies count"><strong>🎬 ${data.moviesCount}</strong></span>
        </div>

        <div class="stats" role="list">
          <div class="stat" role="listitem">
            <small>Date of birth</small>
            <strong>${fmt.date(data.dateOfBirth)}</strong>
          </div>
          <div class="stat" role="listitem">
            <small>Date of debut</small>
            <strong>${fmt.date(data.dateOfDebut)}</strong>
          </div>
          <div class="stat" role="listitem">
            <small>Measurements</small>
            <strong>${data.measurements}</strong>
          </div>
          <div class="stat" role="listitem">
            <small>Cup size</small>
            <strong>${data.cupSize}</strong>
          </div>
          <div class="stat" role="listitem">
            <small>Height</small>
            <strong>${data.heightCm} cm</strong>
          </div>
          <div class="stat" role="listitem">
            <small>Total films</small>
            <strong>${data.moviesCount}</strong>
          </div>
        </div>

        <div class="tags" aria-label="Tags">
          ${data.tags.map((t) => `<span class="tag">#${t}</span>`).join("")}
        </div>
      `;
            }

            // Render covers
            function renderCovers(covers) {
                const track = document.getElementById("coverTrack");
                track.innerHTML = covers
                    .map(
                        (src, i) => `
        <figure class="slide" aria-label="Slide ${i + 1} of ${covers.length}">
          <img src="${src}" alt="Cover ${i + 1}" loading="lazy"/>
        </figure>
      `
                    )
                    .join("");
            }

            // Render posters
            function renderPosters(movies) {
                const posters = document.getElementById("posters");
                posters.innerHTML = movies
                    .map(
                        (m) => `
        <article class="poster" tabindex="0" aria-label="${m.title} (${m.year})">
          <img src="${m.poster}" alt="${m.title} poster" loading="lazy" />
          <div class="meta">
            <strong style="font-size:13px;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${m.title}">${m.title}</strong>
            <span>${m.year}</span>
          </div>
        </article>
      `
                    )
                    .join("");
            }

            // Carousel behavior (auto-scroll, hover pause, swipe/drag)
            function initCarousel(trackId, prevBtnId, nextBtnId) {
                const track = document.getElementById(trackId);
                const prevBtn = document.getElementById(prevBtnId);
                const nextBtn = document.getElementById(nextBtnId);

                const speedPxPerStep = 2;
                const stepMs = 16;
                let timer = null,
                    isHovering = false;

                const atEnd = () => Math.ceil(track.scrollLeft + track.clientWidth) >= track.scrollWidth;
                function loop() {
                    if (isHovering) return;
                    if (atEnd()) track.scrollTo({ left: 0, behavior: "instant" });
                    track.scrollLeft += speedPxPerStep;
                    timer = setTimeout(loop, stepMs);
                }
                const start = () => {
                    if (!timer) timer = setTimeout(loop, 1200);
                };
                const stop = () => {
                    if (timer) {
                        clearTimeout(timer);
                        timer = null;
                    }
                };

                track.addEventListener("pointerenter", () => {
                    isHovering = true;
                    stop();
                });
                track.addEventListener("pointerleave", () => {
                    isHovering = false;
                    start();
                });

                prevBtn.addEventListener("click", () => {
                    stop();
                    track.scrollBy({ left: -track.clientWidth * 0.9, behavior: "smooth" });
                });
                nextBtn.addEventListener("click", () => {
                    stop();
                    track.scrollBy({ left: track.clientWidth * 0.9, behavior: "smooth" });
                });

                track.addEventListener("keydown", (e) => {
                    if (e.key === "ArrowRight") {
                        e.preventDefault();
                        nextBtn.click();
                    }
                    if (e.key === "ArrowLeft") {
                        e.preventDefault();
                        prevBtn.click();
                    }
                });

                // Drag/swipe
                let isDown = false,
                    startX = 0,
                    scrollStart = 0;
                track.addEventListener("pointerdown", (e) => {
                    isDown = true;
                    startX = e.clientX;
                    scrollStart = track.scrollLeft;
                    track.setPointerCapture(e.pointerId);
                    stop();
                });
                track.addEventListener("pointermove", (e) => {
                    if (!isDown) return;
                    track.scrollLeft = scrollStart - (e.clientX - startX);
                });
                ["pointerup", "pointercancel", "pointerleave"].forEach((ev) =>
                    track.addEventListener(ev, () => {
                        isDown = false;
                        !isHovering && start();
                    })
                );

                // Resize guard
                let rT;
                window.addEventListener("resize", () => {
                    clearTimeout(rT);
                    rT = setTimeout(() => {
                        if (atEnd()) track.scrollTo({ left: 0 });
                    }, 150);
                });

                start();
            }

            // Boot
            document.getElementById("year").textContent = new Date().getFullYear();
            renderProfile(modelData);
            renderCovers(modelData.covers);
            renderPosters(modelData.movies);
            initCarousel("coverTrack", "prevBtn", "nextBtn");

            // Export minimal API
            window.renderModel = (data) => {
                renderProfile(data);
                renderCovers(data.covers || []);
                renderPosters(data.movies || []);
            };
        </script>
    </body>
</html>
