<div class="left-head">
  <button id="sidebarToggle" class="icon-btn" aria-label="Toggle sidebar" title="Toggle sidebar">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="brand">
    <span class="brand-mark">⚡</span>
    <span class="brand-name">My App</span>
  </div>
</div>
<div class="header-search" role="search">
  <form id="searchForm" autocomplete="off">
    <input id="searchInput" type="search" placeholder="Search…" aria-label="Search" />
    <button class="icon-btn" id="searchBtn" aria-label="Run search" title="Search">

        <path d="m21 21-4.3-4.3M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </form>
</div>

  <button class="btn" id="refreshBtn" aria-label="Refresh">Refresh</button>
  <div class="notif">

        <path d="M6 8a6 6 0 1 1 12 0v5l1.5 3H4.5L6 13V8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M10 19a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

  <div class="user-menu">

      <button class="menu-item" role="menuitem" data-action="settings">Settings</button>
      <button class="menu-item" role="menuitem" data-action="help">Help</button>
      <hr class="menu-sep" />
