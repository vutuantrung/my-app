<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self';
    img-src 'self' data:;
    font-src 'self';
    connect-src 'self' ws: wss:;
    object-src 'none';
    base-uri 'self';
    form-action 'self';
  " />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Electron Layout Starter</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header" id="slot-header"></header>
    <aside class="app-sidebar" id="slot-sidebar"></aside>
    <main class="app-body" id="slot-body"></main>
    <footer class="app-footer" id="slot-footer"></footer>
  </div>
  <script type="module" src="./js/bootstrap.js"></script>
</body>
</html>
